# MySQL 配置档。启用方式：
#   java -jar picman.jar --spring.profiles.active=mysql
# 或环境变量 SPRING_PROFILES_ACTIVE=mysql
#
# SQLite 仍是默认档，不设 profile 时行为完全不变。
spring:
  datasource:
    url: jdbc:mysql://${PICMAN_MYSQL_HOST:127.0.0.1}:${PICMAN_MYSQL_PORT:3306}/${PICMAN_MYSQL_DB:picman}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PICMAN_MYSQL_USER:root}
    password: ${PICMAN_MYSQL_PASSWORD:}
    hikari:
      # MySQL 支持真正的并发写，不需要像 SQLite 那样压到单连接
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: picman-db
      connection-timeout: 15000
      # MySQL 没有 PRAGMA，这里不能沿用 SQLite 的连接初始化语句
      connection-init-sql: SET NAMES utf8mb4
  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations: classpath:schema-mysql.sql
